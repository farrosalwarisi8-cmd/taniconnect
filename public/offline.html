<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — TaniConnect</title>
  <link rel="icon" href="/icons/icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #15803D 0%, #4ADE80 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: white;
    }
    .container {
      text-align: center;
      max-width: 480px;
    }
    .icon {
      font-size: 96px;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.95); }
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    p {
      font-size: 17px;
      opacity: 0.9;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    button {
      background: white;
      color: #15803D;
      border: none;
      padding: 14px 32px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      min-height: 48px;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .tips {
      margin-top: 40px;
      padding: 20px;
      background: rgba(255,255,255,0.15);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      text-align: left;
    }
    .tips h3 {
      font-size: 15px;
      margin-bottom: 12px;
      opacity: 0.9;
    }
    .tips ul {
      list-style: none;
      font-size: 14px;
      opacity: 0.85;
    }
    .tips li {
      padding: 6px 0;
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🌾</div>
    <h1>Anda Sedang Offline</h1>
    <p>
      TaniConnect butuh koneksi internet untuk menampilkan data terbaru.
      Cek koneksi Anda dan coba lagi.
    </p>
    <button onclick="location.reload()">🔄 Coba Lagi</button>

    <div class="tips">
      <h3>💡 Tips saat offline:</h3>
      <ul>
        <li>📶 Cek sinyal HP atau WiFi</li>
        <li>✈️ Matikan mode pesawat</li>
        <li>🔄 Refresh halaman setelah online</li>
        <li>📱 Data yang sudah kamu buka bisa tetap dilihat</li>
      </ul>
    </div>
  </div>

  <script>
    // Auto-reload saat online kembali
    window.addEventListener('online', () => {
      location.reload()
    })
  </script>
</body>
</html>
