<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — TaniConnect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #15803D, #4ADE80);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: white;
    }

    .container {
      text-align: center;
      max-width: 480px;
    }

    .icon {
      font-size: 96px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    p {
      font-size: 17px;
      opacity: 0.9;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    button {
      background: white;
      color: #15803D;
      border: none;
      padding: 14px 32px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      min-height: 48px;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="icon">🌾</div>
    <h1>Anda Sedang Offline</h1>
    <p>TaniConnect butuh koneksi internet untuk menampilkan data terbaru. Cek koneksi Anda dan coba lagi.</p>
    <button onclick="location.reload()">🔄 Coba Lagi</button>
  </div>
  <script>
    window.addEventListener('online', function () { location.reload() })
  </script>
</body>

</html>
